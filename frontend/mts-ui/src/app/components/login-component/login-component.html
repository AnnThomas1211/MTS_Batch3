<div class="login-container">
  <div class="login-card">

    <div class="admin-badge">
      <span>🛡️</span>
      <span>Admin Portal</span>
    </div>

    <h2>Money Transfer System</h2>
    <p class="subtitle">Administrator access only</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="admin-username">Username</label>
        <input
          id="admin-username"
          type="text"
          formControlName="username"
          placeholder="Enter admin username"
        />
        <span class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          Username is required.
        </span>
      </div>

      <div class="form-group">
        <label for="admin-password">Password</label>
        <input
          id="admin-password"
          type="password"
          formControlName="password"
          placeholder="Enter admin password"
        />
        <span class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required.
        </span>
      </div>

      <div class="form-group">
        <label for="admin-accountId">Account ID</label>
        <input
          id="admin-accountId"
          type="number"
          formControlName="accountId"
          placeholder="Enter account ID"
        />
        <span class="error" *ngIf="loginForm.get('accountId')?.touched && loginForm.get('accountId')?.invalid">
          A valid Account ID is required.
        </span>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" id="admin-login-btn" [disabled]="loginForm.invalid">Sign In as Admin</button>
    </form>

    <p class="user-link">
      Not an admin? <a routerLink="/start">Go to User Portal</a>
    </p>
  </div>
</div>
