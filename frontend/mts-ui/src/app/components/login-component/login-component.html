<div class="login-container">
  <div class="login-card">
    <h2>Money Transfer System</h2>
    <p class="subtitle">Sign in to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter your username"
        />
        <span class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          Username is required.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
        />
        <span class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required.
        </span>
      </div>

      <div class="form-group">
        <label for="accountId">Account ID</label>
        <input
          id="accountId"
          type="number"
          formControlName="accountId"
          placeholder="Enter your account ID"
        />
        <span class="error" *ngIf="loginForm.get('accountId')?.touched && loginForm.get('accountId')?.invalid">
          A valid Account ID is required.
        </span>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Sign In</button>
    </form>
  </div>
</div>
