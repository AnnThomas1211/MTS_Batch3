<div class="profile-wrapper">
  <div class="container mt-4">
    <!-- Profile Card -->
    <div *ngIf="account()" class="card main-card p-4">
      <!-- Back to Dashboard -->
      <div class="d-flex align-items-center mb-3">
        <button class="btn btn-link text-decoration-none p-0 text-secondary" (click)="goToDashboard()">
          <span class="fs-4">←</span> Back
        </button>
      </div>

      <!-- Account Holder Name -->
      <div class="mb-4">
        <p class="text-muted mb-1 small">ACCOUNT HOLDER</p>
        <h3 class="fw-bold">{{ account().holderName }}</h3>
      </div>

      <!-- Account Details Grid -->
      <div class="row g-4 mb-4">
        <!-- Balance Card -->
        <div class="col-md-6">
          <div class="info-card p-3 rounded border">
            <p class="text-muted mb-2 small">Available Balance</p>
            <h4 class="fw-bold text-primary">$ {{ account().balance | number: '1.2-2' }}</h4>
          </div>
        </div>

        <!-- Status Card -->
        <div class="col-md-6">
          <div class="info-card p-3 rounded border">
            <p class="text-muted mb-2 small">Account Status</p>
            <span class="badge" [ngClass]="getStatusBadgeClass()">{{ account().status }}</span>
          </div>
        </div>
      </div>

      <!-- Additional Info -->
      <div class="row g-4 mb-4">
        <!-- Account ID -->
        <div class="col-md-6">
          <div class="info-card p-3 rounded border">
            <p class="text-muted mb-2 small">Account ID</p>
            <p class="fw-bold mb-0">XXXX-XXXX-000{{ account().id }}</p>
          </div>
        </div>

        <!-- Last Updated -->
        <div class="col-md-6">
          <div class="info-card p-3 rounded border">
            <p class="text-muted mb-2 small">Last Updated</p>
            <p class="fw-bold mb-0">{{ account().lastUpdated | date: 'short' }}</p>
          </div>
        </div>
      </div>

      <!-- Version Info -->
      <div class="mt-4 pt-3 border-top">
        <div class="row g-4">
          <div class="col-12 text-center">
            <p class="text-muted mb-1 small">APP VERSION</p>
            <p class="fw-bold">{{ appVersion }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
