<div class="container-fluid py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card border-0 shadow">

        <div class="card-body p-4 ">
          <form [formGroup]="transferForm" (ngSubmit)="submitTransfer()">
            <div class="mb-3">
              <label for="fromAccountId" class="form-label fw-bold">From Account</label>
              <input
                id="fromAccountId"
                formControlName="fromAccountId"
                class="form-control form-control-lg"
                type="text"
                placeholder="Enter your account number"
              />
            </div>
            <div class="mb-3">
              <label for="toAccountId" class="form-label fw-bold">To Account</label>
              <input
                id="toAccountId"
                formControlName="toAccountId"
                class="form-control form-control-lg"
                type="text"
                placeholder="Enter recipient account number"
              />
              <div
                *ngIf="
                  transferForm.get('toAccountId')?.invalid &&
                  transferForm.get('toAccountId')?.touched
                "
                class="text-danger small mt-2"
              >
                Destination account is required
              </div>
            </div>
            <div class="mb-4">
              <label for="amount" class="form-label fw-bold">Amount</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text">$</span>
                <input
                  id="amount"
                  type="number"
                  step="0.01"
                  min="0.01"
                  formControlName="amount"
                  class="form-control"
                  placeholder="0.00"
                />
              </div>
              <div
                *ngIf="transferForm.get('amount')?.invalid && transferForm.get('amount')?.touched"
                class="text-danger small mt-2"
              >
                Enter a valid amount (min $0.01)
              </div>
            </div>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-end">
              <button
                type="submit"
                [disabled]="!transferForm.valid"
                class="btn btn-success btn-lg px-4"
              >
                Transfer Now
              </button>
              <button
                type="button"
                (click)="cancel()"
                class="btn btn-outline-secondary btn-lg px-4"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <div *ngIf="resultMessage && success"
           class="alert alert-success alert-dismissible fade show mt-4"
           role="alert">
        <strong>Success!</strong>
        <span>{{ resultMessage }}</span>
        <button
          type="button"
          class="btn-close"
          (click)="resultMessage = null"
          aria-label="Close"
        ></button>
      </div>
      <div *ngIf="toastVisible" class="error-toast">
        <div class="error-toast-content">
          <span class="error-toast-icon">&#9888;</span>
          <span class="error-toast-message">{{ toastMessage }}</span>
          <button class="error-toast-close" (click)="dismissToast()">&times;</button>
        </div>
      </div>
    </div>
  </div>

</div>
