<div class="login-container">
  <div class="login-card">
    <h2>Create your account</h2>
    <p class="subtitle">Register to start using the Money Transfer System</p>

    <!-- Registration form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="holderName">Name</label>
        <input
          id="holderName"
          type="text"
          formControlName="holderName"
          placeholder="Enter your full name"
          autocomplete="name"
        />
        <span class="error" *ngIf="registerForm.get('holderName')?.touched && registerForm.get('holderName')?.errors?.['required']">
          Name is required.
        </span>
        <span class="error" *ngIf="registerForm.get('holderName')?.touched && registerForm.get('holderName')?.errors?.['maxlength']">
          Name must be at most 100 characters.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Choose a password (min 4 characters)"
          autocomplete="new-password"
        />
        <span class="error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['required']">
          Password is required.
        </span>
        <span class="error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']">
          Password must be at least 4 characters.
        </span>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account...' : 'Register' }}
      </button>

      <p class="switch-auth">
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </p>
    </form>
  </div>
</div>
